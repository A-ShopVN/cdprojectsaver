<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Code Editor</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CodeMirror (Core & Theme) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/vscode-dark.min.css">
    
    <!-- CodeMirror (Languages) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

    <style>
        /* VS Code Color Palette */
        :root {
            --vsc-bg: #1e1e1e;
            --vsc-sidebar: #252526;
            --vsc-activity: #333333;
            --vsc-tab-active: #1e1e1e;
            --vsc-tab-inactive: #2d2d2d;
            --vsc-text: #cccccc;
            --vsc-accent: #007acc;
            --vsc-border: #3c3c3c;
        }

        body { margin: 0; background-color: var(--vsc-bg); color: var(--vsc-text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        
        /* CodeMirror Overrides */
        .CodeMirror { height: 100% !important; font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; }
        .CodeMirror-vscrollbar::-webkit-scrollbar, .CodeMirror-hscrollbar::-webkit-scrollbar { width: 10px; height: 10px; }
        .CodeMirror-vscrollbar::-webkit-scrollbar-thumb, .CodeMirror-hscrollbar::-webkit-scrollbar-thumb { background: #424242; }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #424242; }
        
        /* 120fps Smooth Caret Animation */
        .CodeMirror-cursor { 
            transition: left 0.08s ease-out, top 0.08s ease-out; 
            border-left: 2px solid #007acc !important; 
            z-index: 5; 
        }
        
        /* Custom styles */
        .file-tab { cursor: pointer; border-right: 1px solid var(--vsc-border); transition: background 0.1s; border-top: 1px solid transparent; }
        .file-tab.active { background-color: var(--vsc-bg); color: #fff; border-top: 1px solid var(--vsc-accent); }
        .file-tab:not(.active):hover { background-color: #2a2d2e; }
        
        .project-item { cursor: pointer; transition: all 0.2s ease; }
        .project-item:hover { background-color: #3c3c3c; color: #fff; }
        .project-item.active { background-color: #007acc; color: #fff; box-shadow: 0 4px 12px rgba(0, 122, 204, 0.4); }

        .editor-container { display: none; height: 100%; width: 100%; }
        .editor-container.active { display: block; }

        /* Dropdown Menus */
        .menu-dropdown { display: none; }
        .group:hover .menu-dropdown { display: block; }
        .sidebar-transition { transition: transform 0.3s ease-in-out; }
    </style>
</head>
<body class="flex h-screen flex-col">

    <header class="h-10 flex items-center justify-between px-4 text-sm flex-shrink-0 z-50" style="background-color: var(--vsc-activity);">
        <div class="flex items-center">
            <button id="btn-toggle-sidebar" class="md:hidden text-gray-400 hover:text-white mr-3"><i class="fas fa-bars"></i></button>
            <div class="font-semibold text-white tracking-wide mr-6 flex items-center">
                <i class="fas fa-code text-blue-400 mr-2"></i><span class="hidden sm:inline">Web Editor</span>
            </div>
            
            <div class="flex space-x-1 text-gray-400">
                <div class="relative group">
                    <div class="hover:text-white hover:bg-[#444] px-3 py-1.5 rounded-xl cursor-pointer transition-colors">File</div>
                    <!-- Lớp đệm pt-2 tạo cầu nối vô hình chống mất menu -->
                    <div class="menu-dropdown absolute left-0 top-full pt-2 z-50 w-52">
                        <div class="bg-[#252526]/90 backdrop-blur-xl border border-[#3c3c3c] rounded-2xl shadow-2xl py-2 overflow-hidden">
                            <div class="px-4 py-2.5 hover:bg-[#007acc] cursor-pointer text-white flex items-center transition-colors" id="menu-file-new"><i class="fas fa-file-medical w-6 text-center"></i> Dự án mới</div>
                            <div class="px-4 py-2.5 hover:bg-[#007acc] cursor-pointer text-white flex items-center transition-colors" id="menu-file-save"><i class="fas fa-save w-6 text-center"></i> Lưu dự án (Ctrl+S)</div>
                        </div>
                    </div>
                </div>
                <div class="relative group">
                    <div class="hover:text-white hover:bg-[#444] px-3 py-1.5 rounded-xl cursor-pointer transition-colors">Edit</div>
                    <div class="menu-dropdown absolute left-0 top-full pt-2 z-50 w-52">
                        <div class="bg-[#252526]/90 backdrop-blur-xl border border-[#3c3c3c] rounded-2xl shadow-2xl py-2 overflow-hidden">
                            <div class="px-4 py-2.5 hover:bg-red-500 cursor-pointer text-white flex items-center transition-colors" id="menu-edit-clear"><i class="fas fa-eraser w-6 text-center"></i> Xóa file hiện tại</div>
                        </div>
                    </div>
                </div>
                <div class="relative group">
                    <div class="hover:text-white hover:bg-[#444] px-3 py-1.5 rounded-xl cursor-pointer transition-colors">View</div>
                    <div class="menu-dropdown absolute left-0 top-full pt-2 z-50 w-56">
                        <div class="bg-[#252526]/90 backdrop-blur-xl border border-[#3c3c3c] rounded-2xl shadow-2xl py-2 overflow-hidden">
                            <div class="px-4 py-2.5 hover:bg-[#007acc] cursor-pointer text-white flex items-center transition-colors" id="menu-view-preview"><i class="fas fa-columns w-6 text-center"></i> Bật/Tắt Preview</div>
                            <div class="px-4 py-2.5 hover:bg-[#007acc] cursor-pointer text-white flex items-center transition-colors" id="menu-view-fullscreen"><i class="fas fa-external-link-alt w-6 text-center"></i> Chạy Live Full Screen</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <span id="auth-status" class="text-xs text-gray-400 hidden sm:inline bg-black/20 px-3 py-1.5 rounded-full"><i class="fas fa-spinner fa-spin mr-1"></i> Đang kết nối...</span>
            <button id="btn-save" class="bg-[#007acc] hover:bg-blue-500 text-white px-4 py-1.5 rounded-xl text-xs transition-all shadow-lg shadow-blue-500/20 flex items-center opacity-50 cursor-not-allowed" disabled>
                <i class="fas fa-save mr-1.5"></i> Save
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        <!-- Sidebar -->
        <aside id="sidebar" class="absolute md:relative z-40 h-full w-64 md:w-60 flex flex-col border-r custom-scrollbar overflow-y-auto sidebar-transition transform -translate-x-full md:translate-x-0" style="background-color: var(--vsc-sidebar); border-color: var(--vsc-border);">
            <div class="p-3 text-xs font-semibold tracking-wider text-gray-400 uppercase flex justify-between items-center bg-[#252526] sticky top-0 z-10 border-b border-[#3c3c3c]">
                <span>Dự Án Của Bạn</span>
                <button id="btn-new-project-side" class="hover:text-white p-1" title="Dự án mới"><i class="fas fa-plus"></i></button>
            </div>
            
            <div class="p-3 bg-[#2d2d2d] border-b border-[#3c3c3c]">
                <label class="text-[10px] text-gray-400 uppercase mb-1.5 block font-medium">Tên dự án hiện tại:</label>
                <div class="flex items-center bg-[#1e1e1e] rounded-xl border border-white/5 focus-within:border-[#007acc] shadow-inner transition-colors">
                    <input type="text" id="project-name-input" placeholder="Tên dự án..." class="w-full bg-transparent text-white px-3 py-2 text-sm focus:outline-none placeholder-gray-500" autocomplete="off">
                    <i class="fas fa-edit text-gray-500 pr-3 text-xs"></i>
                </div>
            </div>

            <div class="py-2 text-[10px] text-gray-500 uppercase px-3 font-semibold mt-1">Danh sách đã lưu</div>
            <div id="projects-list" class="flex flex-col text-sm text-gray-300 pb-10"></div>
        </aside>

        <div id="sidebar-overlay" class="absolute inset-0 bg-black bg-opacity-50 z-30 hidden md:hidden"></div>

        <main class="flex-1 flex flex-col lg:flex-row w-full overflow-hidden">
            <div id="code-section" class="flex-1 flex flex-col border-r lg:w-1/2 h-1/2 lg:h-full" style="border-color: var(--vsc-border);">
                <div class="flex text-sm bg-opacity-50 overflow-x-auto custom-scrollbar flex-shrink-0" style="background-color: var(--vsc-tab-inactive);">
                    <div class="file-tab active px-4 py-2 flex items-center space-x-2 whitespace-nowrap" data-tab="html"><i class="fab fa-html5 text-orange-500"></i><span>index.html</span></div>
                    <div class="file-tab px-4 py-2 flex items-center space-x-2 whitespace-nowrap" data-tab="css"><i class="fab fa-css3-alt text-blue-500"></i><span>style.css</span></div>
                    <div class="file-tab px-4 py-2 flex items-center space-x-2 whitespace-nowrap" data-tab="js"><i class="fab fa-js text-yellow-400"></i><span>script.js</span></div>
                </div>
                <div class="flex-1 relative">
                    <div id="editor-html-container" class="editor-container active absolute inset-0"></div>
                    <div id="editor-css-container" class="editor-container absolute inset-0"></div>
                    <div id="editor-js-container" class="editor-container absolute inset-0"></div>
                </div>
            </div>

            <div id="preview-section" class="flex-1 flex flex-col lg:w-1/2 bg-white h-1/2 lg:h-full border-t lg:border-t-0">
                <div class="h-9 flex items-center justify-between px-3 text-xs text-gray-600 bg-gray-200 border-b flex-shrink-0">
                    <div class="flex items-center font-semibold"><i class="fas fa-play mr-2 text-green-600"></i> Live Preview</div>
                    <button id="btn-refresh" class="hover:text-black hover:bg-gray-300 p-1.5 rounded transition"><i class="fas fa-sync-alt"></i></button>
                </div>
                <div class="flex-1 relative w-full h-full bg-white">
                    <iframe id="preview-frame" class="absolute inset-0 w-full h-full border-none"></iframe>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-[#252526]/90 backdrop-blur-xl text-white px-5 py-3.5 rounded-full shadow-2xl border border-white/10 transition-all duration-300 transform translate-y-4 opacity-0 pointer-events-none z-50 text-sm flex items-center max-w-sm">
        <i id="toast-icon" class="fas fa-info-circle mr-3 text-[#007acc] text-lg"></i>
        <span id="toast-msg" class="font-medium">Thông báo</span>
    </div>

    <!-- Custom Dialog Modal (iOS Style) -->
    <div id="custom-dialog" class="fixed inset-0 bg-black/60 z-[200] hidden items-center justify-center backdrop-blur-sm transition-opacity duration-200 opacity-0">
        <div id="dialog-content" class="bg-[#252526]/90 backdrop-blur-xl border border-white/10 rounded-[28px] shadow-2xl w-80 p-6 transform scale-95 transition-transform duration-200">
            <h3 id="dialog-title" class="text-xl font-semibold text-white mb-2 text-center">Xác nhận</h3>
            <p id="dialog-message" class="text-sm text-gray-300 mb-6 text-center leading-relaxed">Bạn có chắc chắn muốn thực hiện hành động này?</p>
            <div class="flex space-x-3">
                <button id="dialog-btn-cancel" class="flex-1 py-3 rounded-xl text-sm font-semibold text-gray-300 bg-white/5 hover:bg-white/10 transition-colors">Hủy</button>
                <button id="dialog-btn-confirm" class="flex-1 py-3 rounded-xl text-sm font-semibold bg-red-500 hover:bg-red-600 text-white transition-all shadow-lg shadow-red-500/20">Đồng ý</button>
            </div>
        </div>
    </div>

    <!-- Auth/Login Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-black/70 z-[100] flex items-center justify-center backdrop-blur-md hidden transition-opacity">
        <div class="bg-[#252526]/90 backdrop-blur-xl border border-white/10 rounded-[32px] shadow-2xl w-96 p-8 transform transition-transform">
            <h2 class="text-xl font-bold text-white mb-5 text-center border-b border-white/10 pb-4">Xác Thực Tài Khoản</h2>
            
            <div class="flex mb-5 border-b border-white/10">
                <button id="tab-login" class="flex-1 py-2 text-sm font-semibold text-white border-b-2 border-[#007acc] transition-colors">Đăng Nhập</button>
                <button id="tab-register" class="flex-1 py-2 text-sm font-semibold text-gray-400 border-b-2 border-transparent hover:text-gray-200 transition-colors">Đăng Ký</button>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5 ml-1">Username (Bắt đầu bằng @)</label>
                    <input type="text" id="auth-username" placeholder="@myname" class="w-full bg-black/20 border border-white/10 rounded-2xl text-white px-4 py-3 text-sm focus:border-[#007acc] focus:bg-black/40 focus:outline-none transition shadow-inner" autocomplete="off">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5 ml-1">UID (Đúng 10 chữ số)</label>
                    <input type="text" id="auth-uid" placeholder="Ví dụ: 1234567890" maxlength="10" class="w-full bg-black/20 border border-white/10 rounded-2xl text-white px-4 py-3 text-sm focus:border-[#007acc] focus:bg-black/40 focus:outline-none transition shadow-inner" autocomplete="off">
                </div>
                <div id="auth-error" class="text-red-400 text-xs text-center hidden font-medium bg-red-500/10 py-2.5 rounded-xl border border-red-500/20"></div>
                <button id="btn-auth-submit" class="w-full bg-[#007acc] hover:bg-blue-500 text-white font-semibold py-3.5 rounded-2xl text-sm transition mt-2 shadow-lg shadow-blue-500/20">
                    Đăng Nhập
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let firebaseConfig;
        if (typeof __firebase_config !== 'undefined') {
            firebaseConfig = JSON.parse(__firebase_config);
        } else {
            firebaseConfig = {
                apiKey: "AIzaSyC4ZdZ4qP0kWMbKGXx7I8DBr_KxaQhzx8g",
                authDomain: "cdprojectsaver.firebaseapp.com",
                projectId: "cdprojectsaver",
                storageBucket: "cdprojectsaver.firebasestorage.app",
                messagingSenderId: "1012149673877",
                appId: "1:1012149673877:web:600b58cb8889819d39a09c",
                measurementId: "G-XR2PC80402"
            };
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'web-code-editor-app';
        let currentUser = null;
        let currentUsername = null;
        let unsubscribeProjects = null;

        let currentProjectId = null;
        let previewTimeout = null;
        let activeTabLang = 'html';
        let showPreview = true;

        const editorConfig = { theme: 'vscode-dark', lineNumbers: true, autoCloseTags: true, autoCloseBrackets: true };
        
        const editorHtml = CodeMirror(document.getElementById('editor-html-container'), { ...editorConfig, mode: 'htmlmixed' });
        const editorCss = CodeMirror(document.getElementById('editor-css-container'), { ...editorConfig, mode: 'css' });
        const editorJs = CodeMirror(document.getElementById('editor-js-container'), { ...editorConfig, mode: 'javascript' });

        const defaultHtml = `<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <title>Trang Web Của Tôi</title>\n</h`+`ead>\n<b`+`ody>\n  <h1>Xin chào Thế giới!</h1>\n  <p>Dự án Code Editor mới của bạn.</p>\n</b`+`ody>\n</h`+`tml>`;
        const defaultCss = `body {\n  font-family: Arial, sans-serif;\n  text-align: center;\n  padding-top: 50px;\n  background-color: #f0f4f8;\n}\n\nh1 {\n  color: #007acc;\n}`;
        const defaultJs = `console.log("Ứng dụng đã khởi chạy thành công!");`;

        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-msg').textContent = msg;
            
            icon.className = 'mr-3 text-lg fas ';
            if (type === 'success') { icon.className += 'fa-check-circle text-green-400'; }
            else if (type === 'error') { icon.className += 'fa-exclamation-circle text-red-400'; }
            else { icon.className += 'fa-info-circle text-[#007acc]'; }

            toast.classList.remove('opacity-0', 'translate-y-4');
            setTimeout(() => toast.classList.add('opacity-0', 'translate-y-4'), 3000);
        }

        // Custom iOS-style Dialog (thay thế alert/confirm)
        function showConfirmDialog(title, message, isAlert = false) {
            return new Promise((resolve) => {
                const dialog = document.getElementById('custom-dialog');
                const dialogContent = document.getElementById('dialog-content');
                const titleEl = document.getElementById('dialog-title');
                const msgEl = document.getElementById('dialog-message');
                const btnCancel = document.getElementById('dialog-btn-cancel');
                const btnConfirm = document.getElementById('dialog-btn-confirm');

                titleEl.textContent = title;
                msgEl.textContent = message;

                if (isAlert) {
                    btnCancel.classList.add('hidden');
                    btnConfirm.textContent = "OK";
                    btnConfirm.className = "flex-1 py-3 rounded-xl text-sm font-semibold bg-[#007acc] hover:bg-blue-500 text-white transition-all shadow-lg shadow-blue-500/20";
                } else {
                    btnCancel.classList.remove('hidden');
                    btnConfirm.textContent = "Đồng ý";
                    btnConfirm.className = "flex-1 py-3 rounded-xl text-sm font-semibold bg-red-500 hover:bg-red-600 text-white transition-all shadow-lg shadow-red-500/20";
                }

                dialog.classList.remove('hidden');
                setTimeout(() => {
                    dialog.classList.remove('opacity-0');
                    dialogContent.classList.remove('scale-95');
                    dialogContent.classList.add('scale-100');
                }, 10);

                const closeDialog = (result) => {
                    dialog.classList.add('opacity-0');
                    dialogContent.classList.remove('scale-100');
                    dialogContent.classList.add('scale-95');
                    setTimeout(() => {
                        dialog.classList.add('hidden');
                        resolve(result);
                    }, 200);
                    btnConfirm.removeEventListener('click', onConfirm);
                    btnCancel.removeEventListener('click', onCancel);
                };

                const onConfirm = () => closeDialog(true);
                const onCancel = () => closeDialog(false);

                btnConfirm.addEventListener('click', onConfirm);
                btnCancel.addEventListener('click', onCancel);
            });
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function getCombinedCode() {
            const html = editorHtml.getValue();
            const cssTagOpen = "<" + "style" + ">";
            const cssTagClose = "<" + "/style" + ">";
            const jsTagOpen = "<" + "script" + ">";
            const jsTagClose = "<" + "/script" + ">";

            const css = cssTagOpen + editorCss.getValue() + cssTagClose;
            const rawJs = editorJs.getValue();
            const safeJs = `try { ${rawJs} } catch(e) { console.error('Lỗi JS:', e.message); }`;
            const js = jsTagOpen + safeJs + jsTagClose;
            
            return html + css + js;
        }

        function updatePreview() {
            const iframe = document.getElementById('preview-frame');
            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(getCombinedCode());
            doc.close();
        }

        function loadProjects() {
            if (!currentUsername) return;
            const projectsRef = collection(db, 'artifacts', appId, 'users', currentUsername, 'projects');
            
            unsubscribeProjects = onSnapshot(projectsRef, (snapshot) => {
                const projectsList = document.getElementById('projects-list');
                let projects = [];
                snapshot.forEach(doc => { projects.push({ id: doc.id, ...doc.data() }); });
                projects.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

                if (projects.length === 0) {
                    projectsList.innerHTML = `<div class="px-4 py-3 text-xs text-gray-500 italic">Chưa có dự án nào.</div>`;
                    return;
                }

                projectsList.innerHTML = '';
                projects.forEach(proj => {
                    const div = document.createElement('div');
                    div.className = `project-item px-3 py-2 flex items-center justify-between mx-2 my-1 rounded-xl ${proj.id === currentProjectId ? 'active' : ''}`;
                    
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'truncate max-w-[140px] font-medium';
                    nameSpan.innerHTML = `<i class="fas fa-file-code text-[#007acc] mr-2 text-xs"></i>${proj.name || 'Dự án không tên'}`;
                    
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'text-gray-400 hover:text-red-400 opacity-0 group-hover:opacity-100 transition p-1.5 hover:bg-black/20 rounded-lg';
                    deleteBtn.innerHTML = '<i class="fas fa-trash-alt text-xs"></i>';
                    deleteBtn.onclick = async (e) => {
                        e.stopPropagation();
                        const ok = await showConfirmDialog("Xóa dự án", `Bạn có chắc muốn xóa "${proj.name}" không? Thao tác này không thể hoàn tác.`);
                        if(ok) deleteProject(proj.id);
                    };

                    div.classList.add('group');
                    div.appendChild(nameSpan); div.appendChild(deleteBtn);
                    div.onclick = () => openProject(proj);
                    projectsList.appendChild(div);
                });
            }, (error) => console.error("Lỗi lấy dữ liệu:", error));
        }

        function openProject(proj) {
            if(currentProjectId === proj.id) return;
            currentProjectId = proj.id;
            document.getElementById('project-name-input').value = proj.name || 'Dự án không tên';
            
            editorHtml.setValue(proj.html || '');
            editorCss.setValue(proj.css || '');
            editorJs.setValue(proj.js || '');
            
            document.querySelectorAll('.project-item').forEach(item => {
                item.classList.remove('active'); 
            });
            showToast(`Đã mở dự án: ${proj.name}`, 'success');
            
            if(window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('sidebar-overlay').classList.add('hidden');
            }
            updatePreview();
        }

        function createNewProject() {
            currentProjectId = `proj_${Date.now()}`;
            document.getElementById('project-name-input').value = 'Project Mới';
            editorHtml.setValue(defaultHtml);
            editorCss.setValue(defaultCss);
            editorJs.setValue(defaultJs);
            document.querySelectorAll('.project-item').forEach(item => item.classList.remove('active'));
            showToast("Đã tạo không gian code mới");
            updatePreview();
        }

        async function saveProject() {
            if (!currentUsername) return;
            const btnSave = document.getElementById('btn-save');
            btnSave.innerHTML = `<i class="fas fa-spinner fa-spin mr-1.5"></i> Saving...`;
            
            try {
                if (!currentProjectId) currentProjectId = `proj_${Date.now()}`;
                const projectName = document.getElementById('project-name-input').value || 'Dự án không tên';
                const docRef = doc(db, 'artifacts', appId, 'users', currentUsername, 'projects', currentProjectId);
                
                await setDoc(docRef, {
                    name: projectName,
                    html: editorHtml.getValue(),
                    css: editorCss.getValue(),
                    js: editorJs.getValue(),
                    updatedAt: Date.now()
                }, { merge: true });

                showToast(`Đã lưu "${projectName}"`, "success");
            } catch (error) {
                console.error("Lỗi khi lưu:", error);
                showToast("Lỗi lưu dự án", "error");
            } finally {
                btnSave.innerHTML = `<i class="fas fa-save mr-1.5"></i> Save`;
            }
        }

        async function deleteProject(id) {
            if (!currentUsername) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', currentUsername, 'projects', id));
                showToast("Đã xóa dự án", "success");
                if (currentProjectId === id) createNewProject();
            } catch (error) {
                console.error("Lỗi xóa dự án:", error);
            }
        }

        let isLoginMode = true;
        const authModal = document.getElementById('auth-modal');
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const usernameInput = document.getElementById('auth-username');
        const uidInput = document.getElementById('auth-uid');
        const authError = document.getElementById('auth-error');
        const btnAuthSubmit = document.getElementById('btn-auth-submit');

        function switchAuthMode(login) {
            isLoginMode = login;
            authError.classList.add('hidden');
            if(login) {
                tabLogin.classList.replace('text-gray-400', 'text-white');
                tabLogin.classList.replace('border-transparent', 'border-[#007acc]');
                tabRegister.classList.replace('text-white', 'text-gray-400');
                tabRegister.classList.replace('border-[#007acc]', 'border-transparent');
                btnAuthSubmit.textContent = "Đăng Nhập";
            } else {
                tabRegister.classList.replace('text-gray-400', 'text-white');
                tabRegister.classList.replace('border-transparent', 'border-[#007acc]');
                tabLogin.classList.replace('text-white', 'text-gray-400');
                tabLogin.classList.replace('border-[#007acc]', 'border-transparent');
                btnAuthSubmit.textContent = "Đăng Ký";
            }
        }

        tabLogin.addEventListener('click', () => switchAuthMode(true));
        tabRegister.addEventListener('click', () => switchAuthMode(false));

        usernameInput.addEventListener('input', (e) => {
            let val = e.target.value.trim().replace(/\s+/g, '');
            if(val && !val.startsWith('@')) val = '@' + val;
            e.target.value = val;
        });

        uidInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 10);
        });

        btnAuthSubmit.addEventListener('click', async () => {
            const username = usernameInput.value.trim();
            const uidVal = uidInput.value.trim();

            if(!username || username === '@' || username.length < 3) {
                authError.textContent = "Username cần ít nhất 2 ký tự sau '@'";
                authError.classList.remove('hidden'); return;
            }
            if(uidVal.length !== 10) {
                authError.textContent = "UID phải có chính xác 10 chữ số";
                authError.classList.remove('hidden'); return;
            }

            authError.classList.add('hidden');
            btnAuthSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';
            btnAuthSubmit.disabled = true;

            try {
                // Đảm bảo phải có UID ẩn danh từ Firebase trước khi thao tác Database
                if (!currentUser) await signInAnonymously(auth);

                const accountRef = doc(db, 'artifacts', appId, 'public_accounts', username);
                const accountSnap = await getDoc(accountRef);

                if(isLoginMode) {
                    if(accountSnap.exists() && accountSnap.data().uid10 === uidVal) {
                        currentUsername = username;
                        authModal.classList.add('hidden');
                        document.getElementById('auth-status').innerHTML = `<i class="fas fa-user-circle text-green-500 mr-1"></i> ${username}`;
                        loadProjects(); createNewProject();
                        showToast(`Chào mừng ${username}!`, 'success');
                        document.getElementById('btn-save').disabled = false;
                        document.getElementById('btn-save').classList.remove('opacity-50', 'cursor-not-allowed');
                    } else {
                        authError.textContent = "Username hoặc UID không chính xác!";
                        authError.classList.remove('hidden');
                    }
                } else {
                    if(accountSnap.exists()) {
                        authError.textContent = "Username này đã có người sử dụng!";
                        authError.classList.remove('hidden');
                    } else {
                        await setDoc(accountRef, { uid10: uidVal, createdAt: Date.now() });
                        currentUsername = username;
                        authModal.classList.add('hidden');
                        document.getElementById('auth-status').innerHTML = `<i class="fas fa-user-circle text-green-500 mr-1"></i> ${username}`;
                        loadProjects(); createNewProject();
                        showToast(`Tạo tài khoản thành công!`, 'success');
                        document.getElementById('btn-save').disabled = false;
                        document.getElementById('btn-save').classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                }
            } catch (err) {
                console.error("Lỗi:", err);
                authError.textContent = "Lỗi kết nối. Vui lòng thử lại!";
                authError.classList.remove('hidden');
            } finally {
                btnAuthSubmit.textContent = isLoginMode ? "Đăng Nhập" : "Đăng Ký";
                btnAuthSubmit.disabled = false;
            }
        });

        // Initialize Anonymous Auth to get a basic session
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                if(!currentUsername) authModal.classList.remove('hidden');
            }
        });
        signInAnonymously(auth).catch(e => console.error("Anonymous auth failed", e));

        document.querySelectorAll('.file-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelectorAll('.file-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.editor-container').forEach(c => c.classList.remove('active'));
                
                const targetTab = e.currentTarget;
                targetTab.classList.add('active');
                activeTabLang = targetTab.getAttribute('data-tab');
                document.getElementById(`editor-${activeTabLang}-container`).classList.add('active');
                
                if (activeTabLang === 'html') editorHtml.refresh();
                if (activeTabLang === 'css') editorCss.refresh();
                if (activeTabLang === 'js') editorJs.refresh();
            });
        });

        document.getElementById('btn-toggle-sidebar').addEventListener('click', toggleSidebar);
        document.getElementById('sidebar-overlay').addEventListener('click', toggleSidebar);

        document.getElementById('menu-file-new').addEventListener('click', createNewProject);
        document.getElementById('menu-file-save').addEventListener('click', saveProject);
        document.getElementById('btn-new-project-side').addEventListener('click', createNewProject);
        document.getElementById('btn-save').addEventListener('click', saveProject);
        
        document.getElementById('menu-edit-clear').addEventListener('click', async () => {
            const ok = await showConfirmDialog("Xóa mã nguồn", "Bạn có chắc muốn xóa sạch toàn bộ nội dung của file này không?", false);
            if(ok) {
                if (activeTabLang === 'html') editorHtml.setValue('');
                if (activeTabLang === 'css') editorCss.setValue('');
                if (activeTabLang === 'js') editorJs.setValue('');
                updatePreview();
            }
        });

        document.getElementById('menu-view-preview').addEventListener('click', () => {
            showPreview = !showPreview;
            const previewSection = document.getElementById('preview-section');
            if(showPreview) previewSection.classList.remove('hidden');
            else previewSection.classList.add('hidden');
            setTimeout(() => { editorHtml.refresh(); editorCss.refresh(); editorJs.refresh(); }, 50);
        });

        // Full Screen Feature
        document.getElementById('menu-view-fullscreen').addEventListener('click', async () => {
            const win = window.open('', '_blank');
            if(win) {
                win.document.open();
                win.document.write(getCombinedCode());
                win.document.close();
            } else {
                await showConfirmDialog("Trình duyệt chặn cửa sổ", "Trình duyệt của bạn đã chặn Popup. Vui lòng cấp quyền mở Tab mới để chạy Full Screen!", true);
            }
        });

        document.getElementById('btn-refresh').addEventListener('click', updatePreview);

        const onEditorChange = () => {
            clearTimeout(previewTimeout);
            previewTimeout = setTimeout(updatePreview, 800);
        };
        editorHtml.on('change', onEditorChange);
        editorCss.on('change', onEditorChange);
        editorJs.on('change', onEditorChange);

        document.getElementById('project-name-input').addEventListener('change', () => {
            if(currentProjectId && currentUsername) saveProject();
        });
        
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
                e.preventDefault();
                saveProject();
            }
        });

        setTimeout(() => {
            editorHtml.refresh();
            editorCss.refresh();
            editorJs.refresh();
        }, 500);
        
        window.addEventListener('resize', () => {
            editorHtml.refresh();
            editorCss.refresh();
            editorJs.refresh();
        });
    </script>
</body>
</html>
